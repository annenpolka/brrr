
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
spec:
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          hostAliases:
            type: array
            x-kubernetes-list-map-keys:
            - ip
            items:
              required:
              - ip
              properties:
                ip:
                  type: string
  - name: v2
    schema:
      openAPIV3Schema:
        properties:
          hostAliases:
            type: array
            x-kubernetes-list-map-keys:
            - ip
            items:
              properties:
                ip:
                  type: string
