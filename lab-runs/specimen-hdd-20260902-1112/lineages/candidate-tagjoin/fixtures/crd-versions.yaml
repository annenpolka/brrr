apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
spec:
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          hostAliases:
            description: |-
              HostAliases is an optional list of hosts and IPs.
            type: array
            x-kubernetes-list-map-keys:
            - ip
            items:
              properties:
                ip:
                  type: string
              type: object
            x-kubernetes-list-type: map
          imagePullSecrets:
            type: array
            x-kubernetes-list-map-keys:
            - name
            items:
              properties:
                name:
                  type: string
              type: object
            x-kubernetes-list-type: map
